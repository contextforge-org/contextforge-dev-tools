[package]
name = "cf-integration"
version = "0.7.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = true
authors = ["ContextForge Authors"]
description = "Integration and conformance harness for ContextForge control-plane and data-plane services"
repository = "https://github.com/contextforge-org/contextforge-dev-tools"
readme = "README.md"
keywords = ["contextforge", "mcp", "integration-testing", "conformance"]
categories = ["command-line-utilities", "development-tools::testing"]
default-run = "cf-integration"
autobins = false
include = [
    "/src/**",
    "/docker/**",
    "/scripts/locustfile_mcp.py",
    "/benchmarks/fyre/**",
    "!/benchmarks/fyre/**/__pycache__/**",
    "!/benchmarks/fyre/**/*.pyc",
    "/scripts/live_protocol/sitecustomize.py",
    "/tests/conformance/baselines/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[[bin]]
name = "cf-integration"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
aws-lc-rs = "1.19.0"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
include_dir = "0.7.4"
indicatif = { version = "0.18.6", default-features = false }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
pem = "4.0.0"
redis = { version = "1.8.3", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.9"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3.27.0"
tokio-stream = "0.1.19"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "warn"
