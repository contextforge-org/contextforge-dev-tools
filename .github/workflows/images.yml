name: Harness images

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      tag:
        type: string
        default: ''
      publish_sdk_gateway:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish_sdk_gateway:
        description: Publish the pinned MCP SDK v2 gateway used by FYRE comparisons
        type: boolean
        default: false

jobs:
  build:
    if: ${{ !inputs.publish_sdk_gateway }}
    name: Images (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ -n "$RELEASE_TAG" ]; then test "$RELEASE_TAG" = "v$version"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build fixture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/mcp-conformance-server.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ghcr.io/contextforge-org/cf-integration-fixture:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/contextforge-org/contextforge-dev-tools
          cache-from: type=gha,scope=harness-fixture-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=harness-fixture-${{ matrix.arch }}

      - name: Build tools image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/helpers.Dockerfile
          target: tools
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ghcr.io/contextforge-org/cf-integration-tools:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/contextforge-org/contextforge-dev-tools
          cache-from: type=gha,scope=harness-tools-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=harness-tools-${{ matrix.arch }}

      - name: Build helpers image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/helpers.Dockerfile
          target: helpers
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ghcr.io/contextforge-org/cf-integration-helpers:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/contextforge-org/contextforge-dev-tools
          cache-from: type=gha,scope=harness-helpers-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=harness-helpers-${{ matrix.arch }}

      - name: Smoke test built images
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}-${{ matrix.arch }}
        run: python3 scripts/smoke_harness_images.py

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated images
        if: inputs.publish
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}-${{ matrix.arch }}
        run: |
          for image in fixture tools helpers; do
            docker push "ghcr.io/contextforge-org/cf-integration-$image:$IMAGE_VERSION"
          done

  publish:
    name: Publish image manifests
    if: inputs.publish && !inputs.publish_sdk_gateway
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned multi-platform images
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          version=${RELEASE_TAG#v}
          for image in fixture tools helpers; do
            ref="ghcr.io/contextforge-org/cf-integration-$image"
            docker buildx imagetools create --tag "$ref:$version" "$ref:$version-amd64" "$ref:$version-arm64"
          done

      - name: Verify anonymous image access
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          docker logout ghcr.io
          version=${RELEASE_TAG#v}
          for image in fixture tools helpers; do
            ref="ghcr.io/contextforge-org/cf-integration-$image:$version"
            if ! docker manifest inspect "$ref" >/dev/null; then
              echo "Make the cf-integration-$image GHCR package public, then rerun this release job." >&2
              exit 1
            fi
          done

  sdk-gateway:
    name: SDK v2 gateway (${{ matrix.arch }})
    if: inputs.publish_sdk_gateway
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      GATEWAY_REVISION: 33e2dd93a53a9cc2c5088b731822dfec4852fa2e
      GATEWAY_TAG: sdk-v2-33e2dd93a
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: benchmark
          persist-credentials: false

      - name: Checkout pinned gateway source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IBM/mcp-context-forge
          ref: ${{ env.GATEWAY_REVISION }}
          path: gateway
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: gateway
          file: gateway/Containerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/contextforge-org/cf-integration-fixture:gateway-${{ env.GATEWAY_TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ env.GATEWAY_REVISION }}
            org.opencontainers.image.source=https://github.com/contextforge-org/contextforge-dev-tools
          cache-from: type=gha,scope=sdk-gateway-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sdk-gateway-${{ matrix.arch }}
          provenance: false

  publish-sdk-gateway:
    name: Publish SDK v2 gateway manifest
    if: inputs.publish_sdk_gateway
    needs: sdk-gateway
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      GATEWAY_TAG: sdk-v2-33e2dd93a
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform manifest
        run: |
          ref=ghcr.io/contextforge-org/cf-integration-fixture
          docker buildx imagetools create \
            --tag "$ref:gateway-$GATEWAY_TAG" \
            "$ref:gateway-$GATEWAY_TAG-amd64" \
            "$ref:gateway-$GATEWAY_TAG-arm64"

      - name: Verify anonymous image access
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect \
            "ghcr.io/contextforge-org/cf-integration-fixture:gateway-$GATEWAY_TAG"
