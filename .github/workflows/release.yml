name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run full test suite
        run: cargo test --all-targets --locked

      - name: Verify standalone lazy runtime state
        shell: bash
        run: |
          cargo build --locked --bin cf-integration
          sandbox=$(mktemp -d)
          binary="$GITHUB_WORKSPACE/target/debug/cf-integration"
          if (cd "$sandbox" && CF_INTEGRATION_DIR="$sandbox/state" "$binary" conformance report); then
            echo "report unexpectedly succeeded without prior results" >&2
            exit 1
          fi
          test ! -e "$sandbox/state"
          if (cd "$sandbox" && CF_INTEGRATION_DIR="$sandbox/state" "$binary" stack config --topology dataplane); then
            echo "stack config unexpectedly succeeded outside a checkout" >&2
            exit 1
          fi
          test -f "$sandbox/state/secrets.env"
          find "$sandbox/state/assets" \
            -path '*/docker/docker-compose.cf-integration.yaml' \
            -type f -print -quit | grep -q .

      - name: Verify published package
        run: cargo package --locked

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: cf-integration
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: cf-integration
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: cf-integration
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: cf-integration
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: cf-integration.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: cf-integration.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: target
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2.9.1

      - name: Build release candidate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --bin cf-integration --target "$TARGET"

      - name: Smoke test release candidate
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: '"target/$TARGET/release/$BINARY" --help'

      - name: Package release candidate
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp "target/$TARGET/release/$BINARY" dist/package/
          archive="cf-integration-$TARGET.tgz"
          tar -C dist/package -czf "dist/$archive" "$BINARY"
          if command -v sha256sum >/dev/null; then
            sha256sum "dist/$archive" | sed 's#dist/##' > "dist/$archive.sha256"
          else
            shasum -a 256 "dist/$archive" | sed 's#dist/##' > "dist/$archive.sha256"
          fi

      - name: Upload prevalidated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cf-integration-${{ matrix.target }}
          path: |
            dist/*.tgz
            dist/*.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish crate and tag
    needs: [quality, build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.root-release.outputs.tag }}
    steps:
      - name: Checkout prevalidated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Replace stale unpublished release state
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r 'first(.packages[] | select(.name == "cf-integration") | .version) // ""')
          if [[ -z "$version" ]]; then
            echo "cf-integration is missing from cargo metadata" >&2
            exit 1
          fi

          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          registry_status=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --user-agent 'contextforge-dev-tools-release' \
            "https://crates.io/api/v1/crates/cf-integration/$version")
          case "$registry_status" in
            200)
              exit 0
              ;;
            404)
              ;;
            *)
              echo "crates.io returned HTTP $registry_status while checking cf-integration $version" >&2
              exit 1
              ;;
          esac

          release_rows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft] | @tsv")
          while IFS=$'\t' read -r release_id draft; do
            [[ -z "$release_id" ]] && continue
            if [[ "$draft" != "true" ]]; then
              echo "refusing to replace published GitHub release $tag" >&2
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done <<< "$release_rows"

          if tag_probe=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          elif [[ "$tag_probe" != *"HTTP 404"* ]]; then
            echo "$tag_probe" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            git tag --delete "$tag"
          fi

      - name: Publish root package
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select CLI release
        id: root-release
        shell: bash
        env:
          CANDIDATE_TAG: ${{ steps.release-state.outputs.tag }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r 'first(.[] | select(.package_name == "cf-integration") | .tag) // ""' <<<"$RELEASES")
          if [[ -z "$tag" ]] \
            && git fetch --force origin "refs/tags/$CANDIDATE_TAG:refs/tags/$CANDIDATE_TAG" \
            && [[ "$(git rev-list -n 1 "$CANDIDATE_TAG")" == "$GITHUB_SHA" ]]; then
            version=${CANDIDATE_TAG#v}
            registry_status=$(curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --user-agent 'contextforge-dev-tools-release' \
              "https://crates.io/api/v1/crates/cf-integration/$version")
            if [[ "$registry_status" == "200" ]]; then
              tag=$CANDIDATE_TAG
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish-binaries:
    name: Publish release binaries
    needs: [build-binaries, publish]
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download prevalidated candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cf-integration-*
          path: dist
          merge-multiple: true

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - name: Upload assets and publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest

  release-pr:
    name: Prepare next release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Open or update release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
