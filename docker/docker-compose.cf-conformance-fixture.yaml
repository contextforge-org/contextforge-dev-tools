services:
  mcp_conformance_server:
    profiles: ["conformance"]
    image: ${CF_CONFORMANCE_IMAGE:-ghcr.io/contextforge-org/cf-integration-fixture:${CF_HARNESS_VERSION:?Set CF_HARNESS_VERSION to the cf-integration version}}
    labels:
      name: cf-conformance-server
    pull_policy: ${CF_HARNESS_PULL_POLICY:-missing}
    build:
      context: ${CF_INTEGRATION_ROOT:?Set CF_INTEGRATION_ROOT to the integration harness root}
      dockerfile: docker/mcp-conformance-server.Dockerfile
    restart: "no"
    environment:
      PORT: "3000"
      MCP_CONFORMANCE_SERVER_ERA: ${CF_CONFORMANCE_SERVER_ERA:?Set CF_CONFORMANCE_SERVER_ERA to legacy, modern, or dual}
    ports:
      - "127.0.0.1:${CF_CONFORMANCE_PORT:-0}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/mcp)" = 400
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
