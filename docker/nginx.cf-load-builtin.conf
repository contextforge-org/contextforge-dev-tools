worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
}

http {
    access_log off;
    tcp_nodelay on;
    keepalive_requests 10000;
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream builtin_backend {
        zone builtin_backend 64k;
        server gateway:4444 resolve;
        keepalive 128;
        keepalive_requests 10000;
        # Retire idle connections before Gunicorn's default two-second timeout.
        keepalive_timeout 1s;
    }

    server {
        listen 80;
        server_name localhost;

        # Builtin runs serve MCP on the Python gateway listener. The optional
        # Rust transport listener on 8787 is not started by this lane.
        location / {
            proxy_pass http://builtin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Connection "";
            proxy_hide_header X-CF-Integration-Backend;
            add_header X-CF-Integration-Backend controlplane always;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }
    }
}
