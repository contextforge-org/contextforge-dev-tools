services:
  config_writer:
    profiles: ["helpers"]
    image: ${CF_HELPERS_IMAGE:-ghcr.io/contextforge-org/cf-integration-helpers:0.4.0}
    pull_policy: ${CF_HARNESS_PULL_POLICY:-missing}
    build:
      context: ${CF_INTEGRATION_ROOT:?Set CF_INTEGRATION_ROOT to the integration harness root}
      dockerfile: docker/helpers.Dockerfile
    labels:
      name: cf-dataplane-config-writer
    restart: "no"
    networks:
      - mcpnet
    entrypoint: ["cf-integration", "__helper"]
