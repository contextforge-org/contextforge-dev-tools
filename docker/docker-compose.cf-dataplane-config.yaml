services:
  config_writer:
    profiles: ["helpers"]
    image: cf-integration-helpers:0.3.2-rust
    pull_policy: build
    build:
      context: ${CF_INTEGRATION_ROOT:?Set CF_INTEGRATION_ROOT to the integration harness root}
      dockerfile: docker/helpers.Dockerfile
    labels:
      name: cf-dataplane-config-writer
    restart: "no"
    networks:
      - mcpnet
    entrypoint: ["cf-integration", "__helper"]
