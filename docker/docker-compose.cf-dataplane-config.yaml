services:
  global_config_writer:
    image: ${CF_HELPERS_IMAGE:-ghcr.io/contextforge-org/cf-integration-helpers:${CF_HARNESS_VERSION:?Set CF_HARNESS_VERSION to the cf-integration version}}
    pull_policy: ${CF_HARNESS_PULL_POLICY:-missing}
    build:
      context: ${CF_INTEGRATION_ROOT:?Set CF_INTEGRATION_ROOT to the integration harness root}
      dockerfile: docker/helpers.Dockerfile
    labels:
      name: cf-dataplane-global-config-writer
    restart: "no"
    networks:
      - mcpnet
    environment:
      CF_CONFIG_REDIS_URL: redis://redis:6379
    command:
      - __helper
      - global-config
      - --allowed-hosts
      - ${CF_DATAPLANE_MCP_ALLOWED_HOSTS:-127.0.0.1:${NGINX_PORT:-8080},localhost:${NGINX_PORT:-8080},nginx:80}
      - --allowed-origins
      - ${CF_DATAPLANE_MCP_ALLOWED_ORIGINS:-http://127.0.0.1:${NGINX_PORT:-8080},http://localhost:${NGINX_PORT:-8080}}
    depends_on:
      redis:
        condition: service_healthy

  config_writer:
    profiles: ["helpers"]
    image: ${CF_HELPERS_IMAGE:-ghcr.io/contextforge-org/cf-integration-helpers:${CF_HARNESS_VERSION:?Set CF_HARNESS_VERSION to the cf-integration version}}
    pull_policy: ${CF_HARNESS_PULL_POLICY:-missing}
    build:
      context: ${CF_INTEGRATION_ROOT:?Set CF_INTEGRATION_ROOT to the integration harness root}
      dockerfile: docker/helpers.Dockerfile
    labels:
      name: cf-dataplane-config-writer
    restart: "no"
    networks:
      - mcpnet
    entrypoint: ["cf-integration", "__helper"]
