# Reuse backend connections: load runs otherwise exhaust ephemeral ports after
# tens of thousands of requests while closed sockets remain in TIME_WAIT.
upstream conformance_fixture {
    server mcp_conformance_server:3000;
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://conformance_fixture;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3000;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering "no" always;
    }
}
