# Shared image and container metadata for cf-controlplane services.

services:
  gateway:
    labels:
      name: cf-controlplane
    environment:
      # Keep both harness topologies usable through the current email-login
      # flow. These values are local integration credentials, not production
      # defaults.
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-changeme}
      PASSWORD_CHANGE_ENFORCEMENT_ENABLED: ${PASSWORD_CHANGE_ENFORCEMENT_ENABLED:-false}
      ADMIN_REQUIRE_PASSWORD_CHANGE_ON_BOOTSTRAP: ${ADMIN_REQUIRE_PASSWORD_CHANGE_ON_BOOTSTRAP:-false}
      REQUIRE_PASSWORD_CHANGE_FOR_DEFAULT_PASSWORD: ${REQUIRE_PASSWORD_CHANGE_FOR_DEFAULT_PASSWORD:-false}
    build:
      labels:
        org.opencontainers.image.revision: ${CF_CONTROLPLANE_CHECKOUT_REVISION:-unknown}
        org.opencontainers.image.ref.name: ${CF_CONTROLPLANE_CHECKOUT_REF:-unknown}

  migration:
    labels:
      name: cf-migration
    build:
      labels:
        org.opencontainers.image.revision: ${CF_CONTROLPLANE_CHECKOUT_REVISION:-unknown}
        org.opencontainers.image.ref.name: ${CF_CONTROLPLANE_CHECKOUT_REF:-unknown}

  register_fast_time:
    labels:
      name: cf-register-fast-time

  fast_time_server:
    image: ${FAST_TIME_IMAGE:-ghcr.io/ibm/cfex-mcp-fast-time-server:latest}
    labels:
      name: cf-fast-time-server
    # The current Rust image configures its listener and logging through
    # BIND_ADDRESS and RUST_LOG. Clear the obsolete Go CLI arguments inherited
    # from the control-plane Compose file.
    command: []

  nginx:
    labels:
      name: cf-nginx

  postgres:
    labels:
      name: cf-postgres

  pgbouncer:
    labels:
      name: cf-pgbouncer

  redis:
    labels:
      name: cf-redis

  locust:
    labels:
      name: cf-locust

  locust_worker:
    labels:
      name: cf-locust-worker

  locust_token:
    labels:
      name: cf-locust-token

  a2a_echo_agent:
    labels:
      name: cf-a2a-echo-agent

  a2a_echo_agent_v0_3_0:
    labels:
      name: cf-a2a-echo-agent-v0-3-0

  register_a2a_echo:
    labels:
      name: cf-register-a2a-echo

  mcp_inspector:
    labels:
      name: cf-mcp-inspector

  keycloak:
    labels:
      name: cf-keycloak
